name: Nuget MIFCore

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
    paths:
    - 'MIFCore/**'

  pull_request:
    branches: [ master ]
    paths:
    - 'MIFCore/**'
    - 'MIFCore.Common/**'
    - 'MIFCore.Hangfire/**'
    - 'MIFCore.Tests/**'
    - 'global.json'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:          
          dotnet-version: '10.0.401'
      - name: Restore dependencies
        run: dotnet restore MIFCore
      - name: Build
        run: dotnet build MIFCore --no-restore
      - name: Test
        run: dotnet test MIFCore.Tests --configuration Release --verbosity normal
      - name: Pack
        run: dotnet pack --configuration Release MIFCore
      - name: Publish the package to nuget.org
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: dotnet nuget push MIFCore/bin/Release/*.nupkg -k ${{ secrets.NUGET_AUTH_TOKEN }} -s https://api.nuget.org/v3/index.json
